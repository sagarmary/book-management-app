<div class="books-list">
  <h2>Books List</h2>

  <input
    type="text"
    placeholder="Search by Title..."
    [(ngModel)]="searchQuery"
    (ngModelChange)="applyFilter()"
    class="search-input"
  />

  <!-- Table of books -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of pagedBooks">
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.price | currency }}</td>
        <td>
          <button class="btn-edit" (click)="startEdit(book)">Edit</button>
          <button class="btn-delete" (click)="deleteBook(book.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="pagination" *ngIf="filteredBooks.length > pageSize">
    <button (click)="setPage(page - 1)" [disabled]="page === 1">Prev</button>
    <span>Page {{ page }} of {{ totalPages() }}</span>
    <button (click)="setPage(page + 1)" [disabled]="page === totalPages()">Next</button>
  </div>
</div>

<!-- Edit Form Modal -->
<div class="modal" *ngIf="showEditForm">
  <div class="modal-content">
    <h3>Edit Book</h3>
    <form [formGroup]="editForm" (ngSubmit)="saveEdit()">
      <div class="form-group">
        <label>Title</label>
        <input formControlName="title" />
      </div>
      <div class="form-group">
        <label>Author</label>
        <input formControlName="author" />
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="number" formControlName="price" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-save">Update</button>
        <button type="button" class="btn-cancel" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>
